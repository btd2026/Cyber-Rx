name: E2E Tests

# NOTE: this suite depends on infrastructure that isn't wired in this repo yet
# (a root `npm run start:test` script, docker-compose services, a seeded tests/e2e
# database, and TEST_USER_* / SECURITYSCORECARD secrets). Until that harness is in
# place it would fail on every PR, so it is scoped to manual dispatch + the nightly
# schedule instead of gating pull requests. Re-add `pull_request` once it's green.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  e2e-tests:
    name: E2E Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1/4, 2/4, 3/4, 4/4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd tests/e2e && npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start services
        run: |
          docker-compose up -d postgres redis
          npm run start:test &
          sleep 10

      - name: Seed test database
        run: |
          psql $DATABASE_URL < tests/e2e/fixtures/seed-data.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyberrx_test

      - name: Run E2E tests
        run: cd tests/e2e && npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
        env:
          CI: true
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          SECURITYSCORECARD_API_KEY: ${{ secrets.SECURITYSCORECARD_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.shard }}
          path: tests/e2e/playwright-report/screenshots/
          retention-days: 7

      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: videos-${{ matrix.browser }}-${{ matrix.shard }}
          path: tests/e2e/playwright-report/videos/
          retention-days: 7

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: traces-${{ matrix.browser }}-${{ matrix.shard }}
          path: tests/e2e/playwright-report/trace/
          retention-days: 7

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          cd tests/e2e && npm install

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Start services
        run: |
          docker-compose up -d postgres redis
          npm run start:test &
          sleep 10

      - name: Run smoke tests
        run: cd tests/e2e && npx playwright test smoke --project=chromium
        env:
          CI: true

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [e2e-tests, smoke-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.e2e-tests.result }}" == "failure" ] || [ "${{ needs.smoke-tests.result }}" == "failure" ]; then
            echo "::error::E2E tests failed"
            exit 1
          else
            echo "::notice::E2E tests passed"
          fi
