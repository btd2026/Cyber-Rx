name: CI Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # LINT & VALIDATE
  # ============================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Backend Dependencies
        run: |
          cd cyberrx-api
          npm ci

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Backend Linter
        run: |
          cd cyberrx-api
          npm run lint || true

      - name: Run Frontend Linter
        run: |
          cd frontend
          npm run lint

  # ============================================
  # UNIT TESTS - Backend
  # ============================================
  backend-unit-tests:
    name: Backend Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cyberrx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: cyberrx-api/package-lock.json

      - name: Install dependencies
        working-directory: ./cyberrx-api
        run: npm ci

      - name: Run unit tests
        working-directory: ./cyberrx-api
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://test:testpass@localhost:5432/cyberrx_test
          JWT_SECRET: test-secret-key
        run: npm run test:unit -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./cyberrx-api/coverage/lcov.info
          flags: backend-unit
          name: Backend Unit Tests Coverage (Node ${{ matrix.node-version }})

  # ============================================
  # INTEGRATION TESTS - Backend
  # ============================================
  backend-integration-tests:
    name: Backend Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: backend-unit-tests

    strategy:
      matrix:
        node-version: [18, 20]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cyberrx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: cyberrx-api/package-lock.json

      - name: Install dependencies
        working-directory: ./cyberrx-api
        run: npm ci

      - name: Run integration tests
        working-directory: ./cyberrx-api
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://test:testpass@localhost:5432/cyberrx_test
          JWT_SECRET: test-secret-key
        run: npm run test:integration -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./cyberrx-api/coverage/lcov.info
          flags: backend-integration
          name: Backend Integration Tests Coverage (Node ${{ matrix.node-version }})

  # ============================================
  # UNIT TESTS - Frontend
  # ============================================
  frontend-unit-tests:
    name: Frontend Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test:unit -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend-unit
          name: Frontend Unit Tests Coverage (Node ${{ matrix.node-version }})

  # ============================================
  # BUILD CHECK - Frontend
  # ============================================
  build-frontend:
    name: Build Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, backend-unit-tests, frontend-unit-tests]

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Check build output
        run: |
          if [ -d "frontend/dist" ]; then
            echo "Frontend build successful"
          else
            echo "Frontend build failed"
            exit 1
          fi

  # ============================================
  # BUILD CHECK - Backend
  # ============================================
  build-backend:
    name: Build Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, backend-integration-tests]

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: cyberrx-api/package-lock.json

      - name: Install backend dependencies
        working-directory: ./cyberrx-api
        run: npm ci

      - name: Build backend
        working-directory: ./cyberrx-api
        run: npm run build

  # ============================================
  # COVERAGE THRESHOLD CHECK
  # ============================================
  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend-unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          echo "Required: 80% coverage across all components"
          echo "See individual job reports for detailed coverage metrics"
