name: Deploy Frontend to Vercel (production)

# Publishes the CyberRXNew frontend straight to Vercel PRODUCTION on every push
# to main — so merges appear on the live URL automatically, with no manual
# "Promote to Production" step in the dashboard.
#
# Requires three repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — a Vercel access token (Vercel → Account → Tokens)
#   VERCEL_ORG_ID      — from CyberRXNew/.vercel/project.json or the Vercel project settings
#   VERCEL_PROJECT_ID  — same source
# If those secrets are absent the job fails loudly (and nothing else breaks);
# the log will name exactly which one is missing.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-prod-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Vercel production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CyberRXNew
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Vercel secrets are present
        run: |
          missing=""
          [ -z "${{ secrets.VERCEL_TOKEN }}" ] && missing="$missing VERCEL_TOKEN"
          [ -z "${{ secrets.VERCEL_ORG_ID }}" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them in Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "All Vercel secrets present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (production)
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
