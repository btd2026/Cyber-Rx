name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # TEST & BUILD - Validation on every push/PR
  # ============================================
  # Deployment is handled by native Vercel (frontend) and Render (backend)
  # Git auto-deploy integrations, not by this workflow. This pipeline only
  # validates that both apps install and build cleanly.
  # Paths: frontend = CyberRXNew/, backend = cyberrx-api/.
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---- Backend ----
      - name: Install Backend Dependencies
        run: |
          cd cyberrx-api
          npm install --no-audit --no-fund

      - name: Run Backend Linter
        run: |
          cd cyberrx-api
          npm run lint --if-present || true

      - name: Run Backend Unit Tests (non-blocking legacy suite)
        run: |
          cd cyberrx-api
          npm run test:unit || true

      - name: Build Backend
        run: |
          cd cyberrx-api
          npm run build --if-present

      # ---- Frontend (CyberRXNew) ----
      - name: Install Frontend Dependencies
        run: |
          cd CyberRXNew
          npm install --no-audit --no-fund

      - name: Run Frontend Linter
        run: |
          cd CyberRXNew
          npm run lint --if-present || true

      - name: Run Frontend Smoke Test
        run: |
          cd CyberRXNew
          npm run smoke

      - name: Build Frontend
        run: |
          cd CyberRXNew
          npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
