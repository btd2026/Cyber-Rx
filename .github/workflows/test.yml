name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend Unit Tests
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cyberrx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cyberrx-api/package-lock.json

      - name: Install dependencies
        working-directory: ./cyberrx-api
        run: npm ci

      - name: Run unit tests
        working-directory: ./cyberrx-api
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://test:testpass@localhost:5432/cyberrx_test
          JWT_SECRET: test-secret-key
        run: npm run test:unit -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./cyberrx-api/coverage/lcov.info
          flags: backend-unit
          name: Backend Unit Tests Coverage

  # Backend Integration Tests
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: backend-unit-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cyberrx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cyberrx-api/package-lock.json

      - name: Install dependencies
        working-directory: ./cyberrx-api
        run: npm ci

      - name: Run integration tests
        working-directory: ./cyberrx-api
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://test:testpass@localhost:5432/cyberrx_test
          JWT_SECRET: test-secret-key
        run: npm run test:integration -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./cyberrx-api/coverage/lcov.info
          flags: backend-integration
          name: Backend Integration Tests Coverage

  # Frontend Unit Tests
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test:unit -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend-unit
          name: Frontend Unit Tests Coverage

  # Frontend E2E Tests
  frontend-e2e-tests:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: frontend-unit-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cyberrx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install backend dependencies
        working-directory: ./cyberrx-api
        run: npm ci

      - name: Start backend server
        working-directory: ./cyberrx-api
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://test:testpass@localhost:5432/cyberrx_test
          JWT_SECRET: test-secret-key
          PORT: 3001
        run: |
          npm run start &
          sleep 10

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          NODE_ENV: test
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 30

  # Coverage Check
  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend-unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          echo "Required: 80% coverage across all components"
          echo "See individual job reports for detailed coverage metrics"

  # Build Check
  build-check:
    name: Production Build Check
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend-unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./cyberrx-api
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Check build output
        run: |
          if [ -d "frontend/dist" ]; then
            echo "Frontend build successful"
          else
            echo "Frontend build failed"
            exit 1
          fi
