name: E2E Tests

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  # ============================================
  # E2E TESTS - Full Stack
  # ============================================
  e2e-tests:
    name: E2E Tests - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1/4, 2/4, 3/4, 4/4]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cyberrx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./cyberrx-api
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: ./tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./tests/e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Seed test database
        working-directory: ./cyberrx-api
        env:
          TEST_DATABASE_URL: postgresql://test:testpass@localhost:5432/cyberrx_test
        run: |
          npm run migrate:test || true
          npm run seed:test || true

      - name: Start backend server
        working-directory: ./cyberrx-api
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://test:testpass@localhost:5432/cyberrx_test
          JWT_SECRET: test-secret-key
          REDIS_URL: redis://localhost:6379
          PORT: 3001
        run: |
          npm run start &
          sleep 15

      - name: Verify backend is running
        run: |
          curl -f http://localhost:3001/health || exit 1

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:3001
        run: npm run build

      - name: Start frontend server
        working-directory: ./frontend
        env:
          NODE_ENV: test
          PORT: 3000
        run: |
          npm run preview &
          sleep 10

      - name: Verify frontend is running
        run: |
          curl -f http://localhost:3000 || exit 1

      - name: Run E2E tests
        working-directory: ./tests/e2e
        env:
          CI: true
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.shard }}
          path: tests/e2e/test-results/
          retention-days: 7

  # ============================================
  # SMOKE TESTS
  # ============================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cyberrx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./cyberrx-api
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: ./tests/e2e
        run: npm ci

      - name: Install Playwright
        working-directory: ./tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Seed test database
        working-directory: ./cyberrx-api
        env:
          TEST_DATABASE_URL: postgresql://test:testpass@localhost:5432/cyberrx_test
        run: |
          npm run migrate:test || true
          npm run seed:test || true

      - name: Start backend server
        working-directory: ./cyberrx-api
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://test:testpass@localhost:5432/cyberrx_test
          JWT_SECRET: test-secret-key
          REDIS_URL: redis://localhost:6379
          PORT: 3001
        run: |
          npm run start &
          sleep 15

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:3001
        run: npm run build

      - name: Start frontend server
        working-directory: ./frontend
        env:
          NODE_ENV: test
          PORT: 3000
        run: |
          npm run preview &
          sleep 10

      - name: Run smoke tests
        working-directory: ./tests/e2e
        env:
          CI: true
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001
        run: npx playwright test --grep "@smoke" --project=chromium

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: tests/e2e/playwright-report/
          retention-days: 7

  # ============================================
  # API INTEGRATION TESTS
  # ============================================
  api-integration-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cyberrx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cyberrx-api/package-lock.json

      - name: Install dependencies
        working-directory: ./cyberrx-api
        run: npm ci

      - name: Seed test database
        working-directory: ./cyberrx-api
        env:
          TEST_DATABASE_URL: postgresql://test:testpass@localhost:5432/cyberrx_test
        run: |
          npm run migrate:test || true
          npm run seed:test || true

      - name: Start backend server
        working-directory: ./cyberrx-api
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://test:testpass@localhost:5432/cyberrx_test
          JWT_SECRET: test-secret-key
          REDIS_URL: redis://localhost:6379
          PORT: 3001
        run: |
          npm run start &
          sleep 15

      - name: Verify backend is running
        run: |
          curl -f http://localhost:3001/health || exit 1

      - name: Run API integration tests
        working-directory: ./tests/e2e
        env:
          CI: true
          API_URL: http://localhost:3001
        run: npm test -- --grep "@api"

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: tests/e2e/playwright-report/
          retention-days: 7
