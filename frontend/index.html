      :root { color-scheme: light; }
      body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      /* Signature numerics + display, usable from any inline-styled component.
         Intelligence Brief (editorial): a serif display for headlines (boardroom
         gravitas), Inter for body, mono+tabular numerals for figures. */
      .crx-figure { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
      .crx-display { font-family: 'Source Serif 4', 'Iowan Old Style', Palatino, Georgia, 'Times New Roman', serif; font-weight: 600; letter-spacing: -0.003em; }
