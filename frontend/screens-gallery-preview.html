<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CyberRX — Modern SaaS screen gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" />
<style>
  :root{
    --ink:#0b0c0e;--ink2:#5c6066;--ink3:#8b9098;--hair:#ebecf0;--paper:#fbfbfc;--white:#fff;
    --subtle:#f6f7f9;--borderStrong:#dfe1e6;--accent:#5e6ad2;--accentSoft:#eef0fb;--accentText:#4a52b0;
    --good:#1a7f37;--warn:#9a6700;--weak:#c2410c;--bad:#cf222e;
    --goodSoft:#e6f4ea;--warnSoft:#fbf3da;--weakSoft:#fdeee6;--badSoft:#fdecec;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
    --shadow:0 1px 2px rgba(11,12,14,.05),0 10px 28px -16px rgba(11,12,14,.20);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#eef0f3;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.006em;padding:24px 18px}
  .fig{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .wrap{max-width:1080px;margin:0 auto}
  .switch{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .switch button{background:#fff;border:1px solid var(--hair);border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:var(--font)}
  .switch button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .frame{background:var(--paper);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .hero{background:#fff;padding:20px 26px;border-bottom:1px solid var(--hair)}
  .eyebrow{font-size:11px;font-weight:600;color:var(--accentText);text-transform:uppercase;letter-spacing:.07em}
  h2{margin:5px 0 8px;font-size:22px;font-weight:650;letter-spacing:-.025em}
  .brief{font-size:13px;color:var(--ink2);line-height:1.6;max-width:880px}
  .scorewrap{display:flex;gap:16px;align-items:center;margin-bottom:10px}
  .scorebox{text-align:center}
  .scorebox .n{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .scorebox .l{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
  .content{background:#fff;padding:20px 26px}
  .secLabel{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px}
  .badge{font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .grid{display:grid;gap:10px}
  .card{border:1px solid var(--hair);border-radius:9px;background:#fff;padding:13px 15px}
  .bar{height:6px;background:#f0f1f4;border-radius:999px;overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:999px}
  .heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .htile{border-radius:8px;padding:11px 12px;color:#fff}
  .htile .hn{font-size:11.5px;font-weight:600;opacity:.95}
  .htile .hv{font-size:18px;font-weight:700;margin-top:4px}
  .htile .hs{font-size:10px;opacity:.9;margin-top:2px}
  .exp{display:flex;align-items:center;gap:12px;border:1px solid var(--hair);border-radius:8px;padding:10px 13px;margin-bottom:7px}
  .exp .en{flex:1;font-size:12.5px;font-weight:600}
  .exp .ev{font-size:15px;font-weight:700}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px}
  .kpi{border:1px solid var(--hair);border-radius:9px;padding:12px 14px}
  .kpi .l{font-size:11px;color:var(--ink3)}
  .kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
  .fwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:20px}
  .fw{border:1px solid var(--hair);border-top:3px solid var(--warn);border-radius:10px;padding:11px 13px}
  .fw .fn{font-size:12px;font-weight:700}
  .fw .fv{font-size:22px;font-weight:800;margin-top:2px}
  .fw .fc{display:flex;gap:6px;margin-top:6px;font-size:10px;color:var(--ink3);flex-wrap:wrap}
  .rem{display:flex;justify-content:space-between;gap:10px;border-left:4px solid var(--bad);border:1px solid var(--hair);border-radius:8px;padding:8px 12px;margin-bottom:6px}
  .btn-primary{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:7px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer}
  .inv{border:1px solid var(--hair);border-radius:9px;padding:13px 15px}
  .invflow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
  .note{font-size:12.5px;color:#5c6066;margin-bottom:14px}.note b{color:#0b0c0e}
  .row-sb{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="note"><b>Screen gallery</b> — four more surfaces in the Modern SaaS language (CRO, Board, Control Efficacy, Projects &amp; ROI). All render through the same converted shell. Click to switch.</div>
  <div class="switch" id="switch"></div>
  <div id="screen"></div>
</div>

<script>
const scoreColor=n=>n>=80?'#1a7f37':n>=60?'#9a6700':'#cf222e';
const SOFT={'#cf222e':'#fdecec','#c2410c':'#fdeee6','#9a6700':'#fbf3da','#1a7f37':'#e6f4ea','#8b9098':'#f0f1f4','#5e6ad2':'#eef0fb'};
const badge=(t,c)=>`<span class="badge" style="color:${c};background:${SOFT[c]||'#f0f1f4'}">${t}</span>`;
const T={good:'#1a7f37',warn:'#9a6700',bad:'#cf222e'};

const SCREENS={
'CRO · Enterprise Risk':()=>`
 <div class="frame">
  <div class="hero">
    <div class="eyebrow">CRO · Operational Resilience</div>
    <h2>Executive Risk &amp; Resilience</h2>
    <div class="scorewrap">
      <div class="scorebox"><div class="n fig" style="color:#9a6700">3.4</div><div class="l">aggregate ×appetite</div></div>
      <div class="scorebox"><div class="n fig" style="color:#cf222e">2</div><div class="l">above appetite</div></div>
      <div class="brief">Cyber risk sits <strong style="color:#0b0c0e">above appetite</strong> in two enterprise categories — ransomware to claims adjudication and PHI confidentiality. Aggregation across correlated scenarios pushes tail loss beyond the board-set tolerance band.</div>
    </div>
  </div>
  <div class="content">
    <p class="secLabel">Enterprise risk heatmap (likelihood × impact vs appetite)</p>
    <div class="heat" style="margin-bottom:22px">
      ${[['Ransomware / availability',T.bad,'Above','High × Severe'],['PHI confidentiality',T.bad,'Above','High × Severe'],['Third-party / supply chain',T.warn,'At','Med × High'],['Fraud / claims integrity',T.warn,'At','Med × High'],['Regulatory / compliance',T.good,'Within','Low × Med'],['Business continuity',T.good,'Within','Low × Med']].map(([n,c,s,m])=>`<div class="htile" style="background:${c}"><div class="hn">${n}</div><div class="hv">${s} appetite</div><div class="hs">${m}</div></div>`).join('')}
    </div>
    <p class="secLabel">Top exposures vs appetite</p>
    ${[['Ransomware → claims adjudication','$24M','Above','#cf222e'],['PHI egress via unmanaged SaaS','$11M','Above','#cf222e'],['Vendor supply-chain compromise','$8M','At','#9a6700'],['Insider data exfiltration','$5M','Within','#1a7f37']].map(([n,v,s,c])=>`<div class="exp"><span class="en">${n}</span><span class="ev fig" style="color:${c}">${v}</span>${badge(s+' appetite',c)}</div>`).join('')}
  </div>
 </div>`,

'Board · Oversight':()=>`
 <div class="frame">
  <div class="hero">
    <div class="eyebrow">Board · Enterprise Risk</div>
    <h2>Enterprise Cyber Risk</h2>
    <div class="scorewrap">
      <div class="scorebox"><div class="n fig" style="color:#9a6700">72</div><div class="l">posture · Moderate</div></div>
      <div class="brief">The program is improving but two enterprise risks remain above appetite. Oversight cadence is on track; one decision needs board-level capital allocation this quarter.</div>
    </div>
  </div>
  <div class="content">
    <p class="secLabel">Enterprise oversight</p>
    <div class="kpis">
      ${[['Posture','72','+4'],['Above appetite','2','—'],['Insured loss covered','41%','+6'],['Reg. obligations met','94%','+2'],['Open board decisions','1','—'],['Tabletop readiness','81','+3']].map(([l,v,d])=>`<div class="kpi"><div class="l">${l}</div><div class="v fig" style="color:#0b0c0e">${v}</div><div class="fig" style="font-size:11px;font-weight:600;color:${d.startsWith('+')?'#1a7f37':'#8b9098'};margin-top:4px">${d!=='—'?d:''}</div></div>`).join('')}
    </div>
    <p class="secLabel">Top decisions for the board</p>
    ${[['Approve $15M cyber-insurance limit increase','Closes 60% of modeled ransomware tail loss; premium +$1.1M/yr.','Critical'],['Fund network segmentation program ($4.2M)','Removes lateral-movement path to PHI; 18-month delivery.','High']].map(([t,d,s])=>`<div class="card" style="margin-bottom:8px"><div class="row-sb"><span style="font-size:13px;font-weight:700">${t}</span>${badge(s,s==='Critical'?'#cf222e':'#c2410c')}</div><div style="font-size:11.5px;color:#5c6066;margin-top:5px">${d}</div></div>`).join('')}
  </div>
 </div>`,

'Control Efficacy':()=>`
 <div class="frame">
  <div class="hero">
    <div class="eyebrow">CISO · Control Efficacy</div>
    <h2>Five-Framework Posture</h2>
    <div class="brief">Each control assessed against all five frameworks <strong style="color:#0b0c0e">independently</strong> (no crosswalk). The remediation queue is ranked by leverage — one control that closes several framework gaps leads.</div>
  </div>
  <div class="content">
    <p class="secLabel">Framework posture — assessed independently</p>
    <div class="fwgrid">
      ${[['NIST CSF',74,'#9a6700'],['NIST 800-53',68,'#9a6700'],['CIS Controls',81,'#1a7f37'],['ISO 27001',77,'#9a6700'],['SOC 2',88,'#1a7f37']].map(([n,v,c])=>`<div class="fw" style="border-top-color:${c}"><div class="fn">${n}</div><div class="fv fig" style="color:${c}">${v}%</div><div class="fc"><span style="color:#1a7f37">● met</span><span style="color:#9a6700">● partial</span><span style="color:#cf222e">● gap</span></div></div>`).join('')}
    </div>
    <p class="secLabel">Highest-leverage remediation (one control, multiple framework gaps)</p>
    ${[['Enforce phishing-resistant MFA on privileged accounts','closes 4 framework gaps','#cf222e'],['Centralize log retention to 365 days','closes 3 framework gaps','#c2410c'],['Formalize third-party risk reviews','closes 3 framework gaps','#c2410c']].map(([a,g,c])=>`<div class="rem" style="border-left-color:${c}"><span style="font-size:11.5px;color:#0b0c0e">${a}</span><span class="badge" style="color:${c};background:${SOFT[c]}">${g}</span></div>`).join('')}
  </div>
 </div>`,

'Projects & ROI':()=>`
 <div class="frame">
  <div class="hero">
    <div class="eyebrow">CISO · Key Projects &amp; ROI</div>
    <h2>Investment → Measurable Risk Reduction</h2>
    <div class="brief">Every funded initiative tied to the risk points it removes. Items needing your approval are flagged.</div>
  </div>
  <div class="content">
    <p class="secLabel">Investment → risk reduction</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
      ${[['Privileged access management','$1.2M',64,42,'IAM','Approve phase 2'],['CSPM cloud remediation','$680K',58,39,'Cloud',''],['Backup restore automation','$420K',71,55,'Recovery','Fund'],['DLP egress controls','$540K',60,48,'Data','']].map(([n,sp,b,c,area,dec])=>`<div class="inv"><div class="row-sb"><span style="font-size:12.5px;font-weight:700">${n}</span><span style="font-size:11px;color:#8b9098">${sp}</span></div><div class="invflow"><span style="color:#8b9098">risk ${b}</span><span style="color:#c2410c">→</span><span style="font-weight:700;color:#1a7f37">${c}</span><span style="margin-left:auto;font-size:10px;font-weight:700;color:#1a7f37">−${b-c} pts</span></div><div class="bar"><span style="width:${100-c}%;background:${scoreColor(100-c)}"></span></div><div style="font-size:10.5px;color:#5c6066;margin-top:7px">${area} risk${dec?` · <span style="color:#cf222e;font-weight:600">Decision: ${dec}</span>`:''}</div></div>`).join('')}
    </div>
  </div>
 </div>`,
};

const keys=Object.keys(SCREENS);
const sw=document.getElementById('switch'), sc=document.getElementById('screen');
function show(k){sc.innerHTML=SCREENS[k]();[...sw.children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));}
keys.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.dataset.k=k;b.onclick=()=>show(k);sw.appendChild(b);});
show(keys[0]);
</script>
</body>
</html>
