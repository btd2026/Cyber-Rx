# Render Blueprint (root) — deploy cyberrx-api + scheduler + Postgres.
# Render reads this at the repo root; rootDir points each service at cyberrx-api/.
# Deploy: Render -> New + -> Blueprint -> connect btd2026/Cyber-Rx -> Apply.
# After apply, set the two secret keys in the dashboard (they are sync:false):
# ANTHROPIC_API_KEY and VOYAGE_API_KEY (only needed for the compliance/embedding
# features — the crown-jewels/material-exposure view works without them).
services:
  - type: web
    name: cyberrx-api
    env: node
    region: oregon
    plan: free            # NOTE: free web services sleep when idle (~30-60s cold start).
    rootDir: cyberrx-api   # the API lives in this subfolder
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Allow the deployed cockpit origins (code also allowlists cyberrxnew.* by default)
      - key: CORS_ALLOWLIST
        value: https://cyberrxnew.vercel.app,https://cyber-rx-frontend.vercel.app,http://localhost:5173,http://localhost:3000
      - key: ANTHROPIC_API_KEY
        sync: false        # set in the Render dashboard (secret) — optional for crown-jewels
      - key: VOYAGE_API_KEY
        sync: false        # set in the Render dashboard (secret) — optional for crown-jewels
      - key: DATABASE_URL
        fromDatabase: { name: cyberrx-db, property: connectionString }
      - key: PGHOST
        fromDatabase: { name: cyberrx-db, property: host }
      - key: PGPORT
        fromDatabase: { name: cyberrx-db, property: port }
      - key: PGDATABASE
        fromDatabase: { name: cyberrx-db, property: database }
      - key: PGUSER
        fromDatabase: { name: cyberrx-db, property: user }
      - key: PGPASSWORD
        fromDatabase: { name: cyberrx-db, property: password }

  - type: worker
    name: cyberrx-scheduler
    env: node
    region: oregon
    plan: free
    rootDir: cyberrx-api
    buildCommand: npm install
    startCommand: npm run scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE
        value: https://cyberrx-api.onrender.com
      - key: DATABASE_URL
        fromDatabase: { name: cyberrx-db, property: connectionString }

databases:
  - name: cyberrx-db
    databaseName: cyberrx
    user: cyberrx_user
    plan: free
    region: oregon
