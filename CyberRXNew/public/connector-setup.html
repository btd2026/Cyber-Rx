<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nerion · Connect a tool</title>
<style>
  :root{--bg:#f6f8fc;--panel:#fff;--panel2:#f1f4fa;--ink:#151a24;--ink2:#4a5470;--muted:#7a839c;--line:#e3e8f2;--accent:#4560e0;
    --good:#12925a;--warn:#b9791f;--crit:#d33b40;--blue:#2f6fe0;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1016;--panel:#161a23;--panel2:#1d222d;--ink:#eef1f7;--ink2:#b4bcd0;--muted:#828da5;--line:#262c39;--accent:#8798f0;--good:#34d399;--warn:#e0a94a;--crit:#f0716f;--blue:#7aa2f0}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:30px 20px 80px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1{font-size:23px;margin:6px 0 2px;font-weight:740;letter-spacing:-.02em}
  .sub{color:var(--ink2);max-width:70ch;margin:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:22px}
  .card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:14px;cursor:pointer;transition:border-color .15s,transform .1s,box-shadow .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 18px rgba(30,45,90,.10)}
  .ctile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;box-shadow:0 2px 7px rgba(20,30,60,.18)}
  .ctile svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .cbody{min-width:0;flex:1}
  .card .cn{font-weight:700}.card .cc{color:var(--muted);font-size:12px;margin-top:2px}
  .card .ca{margin-top:9px;font-size:12px;color:var(--ink2)}
  .catlbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 2px;grid-column:1/-1}
  .panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:22px;margin-top:18px}
  .back{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:13px}
  .sec{margin-top:20px}.sec h3{font-size:13px;font-weight:700;letter-spacing:.02em;margin:0 0 3px}
  .sec .why{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:3px 10px;color:var(--ink2)}
  .perm{font-family:var(--mono);font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink2)}
  .fld{margin-bottom:11px}.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
  .fld .h{color:var(--muted);font-weight:400;font-size:11.5px}
  .fld input,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);font-size:13.5px;font-family:inherit}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}@media(max-width:640px){.cols{grid-template-columns:1fr}}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 22px;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}
  .btn:disabled{opacity:.5;cursor:default}
  .prove{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}@media(max-width:640px){.prove{grid-template-columns:1fr}}
  .prove .box{border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--panel2)}
  .prove .box b{font-size:12px}.prove .box.can{border-left:3px solid var(--good)}.prove .box.cant{border-left:3px solid var(--warn)}
  .rrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 9px;border-radius:20px;white-space:nowrap;flex:none}
  .pill.ready{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
  .pill.partial{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .pill.not{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}
  .rrow .rn{font-weight:600;font-size:13px}.rrow .rm{color:var(--ink2);font-size:12.5px;margin-top:2px}
  .rrow .rid{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .status{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px;font-size:12.5px;color:var(--ink2)}
  .status b{color:var(--ink)}
  .muted{color:var(--muted)}
  .tbadges{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
  .tbadge{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2)}
  .tbadge b{color:var(--ink)}
  .tbadge i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
  .tbadge.ready i{background:var(--good)}.tbadge.partial i{background:var(--warn)}.tbadge.not i{background:var(--crit)}
  .tbadge.ready{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}.tbadge.partial{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}.tbadge.not{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
  .rsec{border-top:1px solid var(--line);padding:12px 0}.rsec-h{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Nerion · Continuous control assessment</div>
  <h1 id="hdr">Connect a tool</h1>
  <p class="sub" id="subhdr">Pick a tool and connect it in one click — grant read-only consent and Nerion handles the rest. No API keys or endpoint mapping to figure out; anything else it needs it will ask for only if required.</p>
  <div id="view"></div>
</div>
<script>
(function(){
  function qs(k){try{return new URLSearchParams(window.location.search).get(k)||'';}catch(_){return '';}}
  // API base + org resolve from (1) query params passed by the embedding page,
  // (2) a global override, (3) localStorage, (4) the production API. The empty-
  // string default used to leave the embedded iframe fetching the static host,
  // which has no /api — the catalog then failed to load.
  var API=(qs('api')||window.CYBERRX_API||localStorage.getItem('cyberrx_api_base')||'https://cyber-rx.onrender.com').replace(/\/+$/,'');
  var ORG=qs('org')||window.CYBERRX_ORG_ID||localStorage.getItem('cyberrx_org_id')||'demo';
  var view=document.getElementById('view');
  var MANIFESTS=[], CURRENT=null, FORM={auth:{},tenant:{},scope:{},denom:{},review:'90d'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function api(path,opts){return fetch(API+path,Object.assign({headers:{'Accept':'application/json','Content-Type':'application/json','x-org-id':ORG}},opts||{})).then(function(r){return r.ok?r.json():Promise.reject(r.status);});}

  function loadCatalog(){
    api('/api/connectors/manifests').then(function(d){MANIFESTS=(d&&d.connectors)||[];renderCatalog();})
      .catch(function(){view.innerHTML='<p class="muted" style="margin-top:20px">Could not load connector catalog. Confirm the API is reachable.</p>';});
  }
  // Category-aligned icon tiles. No external logos (Nerion can run air-gapped, and a
  // strict CSP would block CDN images anyway) — each category gets a crafted inline
  // glyph on a color-coded tile so the catalog reads at a glance by what the tool does.
  var GLYPH={
    key:'<circle cx="8" cy="12" r="4"/><path d="M12 12h9M17 12v4M20.5 12v3"/>',
    lock:'<rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/>',
    users:'<circle cx="9" cy="8" r="3.6"/><path d="M2.5 20a6.5 6.5 0 0 1 11.5-4.1M15.5 16.5l2 2 4-4"/>',
    laptop:'<rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 20h20"/><path d="M12 8.5l2.4 1.4v2.2L12 13.5l-2.4-1.4V9.9z"/>',
    bug:'<rect x="8" y="7.5" width="8" height="11" rx="4"/><path d="M8 11.5H4M20 11.5h-4M8 15.5H4M20 15.5h-4M9.2 7.6L7.5 4.8M14.8 7.6l1.7-2.8M12 7.5v11"/>',
    activity:'<path d="M2.5 12.5h4l3 7 4.5-15 3 8h4.5"/>',
    cloud:'<path d="M7 18.5a4.2 4.2 0 0 1-.4-8.4A5.2 5.2 0 0 1 16.6 9 4.3 4.3 0 0 1 17.5 18.5H7z"/>',
    drive:'<rect x="3" y="12" width="18" height="8.5" rx="2"/><path d="M6 12l2.4-6.2A2 2 0 0 1 10.3 4.5h3.4a2 2 0 0 1 1.9 1.3L18 12M7.5 16.3h.01M11 16.3h5.5"/>',
    filelock:'<path d="M13.5 3H7.5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8.5z"/><path d="M13.5 3v5.5h5"/><rect x="9" y="12.5" width="6" height="5" rx="1"/><path d="M10.4 12.5v-1a1.6 1.6 0 0 1 3.2 0v1"/>',
    nodes:'<circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M6 8.2v1.8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8.2M12 12v3.8"/>',
    mail:'<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7.5l8.5 5.5 8.5-5.5"/>',
    plug:'<path d="M9 2.5v5M15 2.5v5M7 7.5h10v3a5 5 0 0 1-10 0zM12 15.5v6"/>',
    plus:'<path d="M12 5v14M5 12h14"/>'};
  // key → [glyph, tile gradient]. Ordered keyword match runs most-specific first.
  var CATICON=[
    [/privileged|pam/i,        ['lock','linear-gradient(135deg,#a78bfa,#7c3aed)']],
    [/governance|iga|identity governance/i, ['users','linear-gradient(135deg,#2dd4bf,#0d9488)']],
    [/identity|sso/i,          ['key','linear-gradient(135deg,#818cf8,#4f46e5)']],
    [/endpoint|edr|xdr/i,      ['laptop','linear-gradient(135deg,#60a5fa,#2563eb)']],
    [/vulnerab/i,              ['bug','linear-gradient(135deg,#fb923c,#ea580c)']],
    [/siem|log|monitor|detection/i, ['activity','linear-gradient(135deg,#22d3ee,#0891b2)']],
    [/cloud|cspm|posture/i,    ['cloud','linear-gradient(135deg,#38bdf8,#0284c7)']],
    [/backup|recovery|disaster/i, ['drive','linear-gradient(135deg,#34d399,#059669)']],
    [/loss prevention|dlp|data/i, ['filelock','linear-gradient(135deg,#f472b6,#db2777)']],
    [/network|segment|zero.?trust/i, ['nodes','linear-gradient(135deg,#6366f1,#4338ca)']],
    [/awareness|email|phish/i, ['mail','linear-gradient(135deg,#fbbf24,#d97706)']]];
  function iconFor(cat,area){
    var s=String(cat||'')+' '+String(area||'');
    for(var i=0;i<CATICON.length;i++){if(CATICON[i][0].test(s))return CATICON[i][1];}
    return ['plug','linear-gradient(135deg,#94a3b8,#475569)'];
  }
  function tile(cat,area){var ic=iconFor(cat,area);return '<div class="ctile" style="background:'+ic[1]+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+GLYPH[ic[0]]+'</svg></div>';}
  function renderCatalog(){
    document.getElementById('hdr').textContent='Connect a tool';
    var byCat={};MANIFESTS.forEach(function(m){(byCat[m.connector_category]=byCat[m.connector_category]||[]).push(m);});
    var html='<div class="grid">';
    Object.keys(byCat).forEach(function(cat){
      html+='<div class="catlbl">'+esc(cat)+'</div>';
      byCat[cat].forEach(function(m){
        var n=(m.supported_framework_controls||[]).length;
        html+='<div class="card" data-id="'+esc(m.connector_id)+'">'+tile(cat,m.control_area)+
          '<div class="cbody"><div class="cn">'+esc(m.connector_name)+'</div>'+
          '<div class="cc">'+esc(m.control_area||cat)+'</div>'+
          '<div class="ca">'+(n?('Supports <b>'+n+'</b> control'+(n>1?'s':'')+' · '+esc((m.supported_control_areas||[]).slice(0,2).join(', '))):'Design-evidence connector')+'</div></div></div>';
      });
      // "Other" card — connect a tool in this category that isn't in the top-listed set.
      html+='<div class="card other" data-other="'+esc(cat)+'"><div class="ctile" style="background:linear-gradient(135deg,#94a3b8,#475569)"><svg viewBox="0 0 24 24" aria-hidden="true">'+GLYPH.plus+'</svg></div>'+
        '<div class="cbody"><div class="cn">Other '+esc(cat)+' tool</div>'+
        '<div class="cc">Not listed here?</div>'+
        '<div class="ca">Connect any '+esc(cat).toLowerCase()+' tool — Nerion maps its telemetry to the controls this category supports.</div></div></div>';
    });
    html+='</div>';view.innerHTML=html;
    view.querySelectorAll('.card[data-id]').forEach(function(el){el.onclick=function(){open(el.getAttribute('data-id'));};});
    view.querySelectorAll('.card.other').forEach(function(el){el.onclick=function(){openOther(el.getAttribute('data-other'));};});
  }

  // Connect a tool that isn't in the curated top set for its category. Keeps the same
  // read-only, control-mapping framing; native support is requested where it isn't live yet.
  function openOther(cat){
    document.getElementById('hdr').textContent='Connect another '+cat+' tool';
    var h='<button class="back" id="back">‹ All tools</button>';
    h+='<div class="panel">';
    h+='<div class="sec"><h3>Connect a '+esc(cat).toLowerCase()+' tool that isn\'t listed</h3>'+
       '<p class="why">Name any '+esc(cat).toLowerCase()+' tool and connect it read-only. Nerion maps its telemetry to the controls this category supports; if native support isn\'t live yet, this registers it and connects via generic API credentials.</p>'+
       '<div class="fld"><label for="otherName">Tool name</label><input id="otherName" placeholder="e.g. JumpCloud, Auth0, …"/></div>'+
       '<div class="cols"><div class="fld"><label for="otherUrl">Instance URL / API endpoint <span class="h">optional</span></label><input id="otherUrl" placeholder="https://your-org.example.com"/></div>'+
       '<div class="fld"><label for="otherTok">API token <span class="h">read-only</span></label><input id="otherTok" type="password" placeholder="paste a read-only token"/></div></div>'+
       '<p class="why" style="margin-top:2px"><b>Read-only access only.</b> Nerion reads configuration and logs to assess controls — it can never change, create, or delete anything in your tool.</p>'+
       '<button class="btn" id="otherGo">Connect &amp; map controls →</button>'+
       '<div id="otherResult"></div>'+
       '</div></div>';
    view.innerHTML=h;
    document.getElementById('back').onclick=renderCatalog;
    document.getElementById('otherGo').onclick=function(){
      var nm=((document.getElementById('otherName')||{}).value||'').trim();
      if(!nm){alert('Enter the tool name first.');return;}
      document.getElementById('otherResult').innerHTML='<div class="sec" style="margin-top:14px"><div class="box can"><b>Connecting '+esc(nm)+'</b>'+
        '<div class="muted" style="margin-top:4px">Nerion is mapping '+esc(nm)+'’s telemetry to the '+esc(cat).toLowerCase()+' controls in your frameworks. Read-only credentials received — you’ll see each control’s readiness once the first sync completes. If native support for '+esc(nm)+' isn’t live yet, our team enables it and notifies you; nothing else to do.</div></div></div>';
    };
  }

  function open(id){
    api('/api/connectors/manifests/'+id).then(function(m){CURRENT=m;FORM={auth:{},tenant:{},scope:{},denom:{},review:'90d'};renderSetup();});
  }

  function fieldInput(prefix,f){
    var id=prefix+'__'+f.key, h=f.help?(' <span class="h">'+esc(f.help)+'</span>'):(f.optional?' <span class="h">optional</span>':'');
    var input;
    if(f.type==='select'){input='<select id="'+id+'" data-k="'+esc(f.key)+'" data-p="'+prefix+'"><option value=""></option>'+(f.options||[]).map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select>';}
    else{input='<input id="'+id+'" data-k="'+esc(f.key)+'" data-p="'+prefix+'" type="'+(f.secret?'password':(f.type==='number'?'number':'text'))+'"'+(f.type==='list'?' placeholder="comma-separated"':'')+'/>';}
    return '<div class="fld"><label for="'+id+'">'+esc(f.label)+h+'</label>'+input+'</div>';
  }

  function renderSetup(){
    var m=CURRENT;
    document.getElementById('hdr').textContent=m.connector_name;
    var ctrls=(m.supported_framework_controls||[]);
    var h='<button class="back" id="back">‹ All tools</button>';
    h+='<div class="panel">';
    // Step 2 — what Nerion can assess. We show the honest can-prove / cannot-prove
    // framing plus a coverage SUMMARY (count + frameworks). We deliberately do NOT
    // list the exact connector→control mapping here — that mapping is Nerion's
    // methodology, and the per-control detail is earned in the readiness section
    // after connecting. The old standalone control-areas chip row duplicated the
    // "can prove" box, so it's removed.
    var fwSet=[];ctrls.forEach(function(c){var f=String(c.framework||'').split(' ')[0];if(f&&fwSet.indexOf(f)<0)fwSet.push(f);});
    h+='<div class="sec"><h3>What Nerion will continuously assess from this tool</h3>'+
       '<p class="why">Nerion knows which controls this tool supports and what telemetry to pull — you don\'t need to.</p>'+
       '<div class="prove"><div class="box can"><b>What this connector can prove</b><div class="muted" style="margin-top:4px">'+esc(m.what_this_connector_can_prove)+'</div></div>'+
       '<div class="box cant"><b>What it cannot prove alone</b><div class="muted" style="margin-top:4px">'+esc(m.what_this_connector_cannot_prove_alone)+'</div></div></div>'+
       (ctrls.length?('<p class="why" style="margin-top:10px">Feeds continuous assessment of <b>'+ctrls.length+'</b> control'+(ctrls.length>1?'s':'')+(fwSet.length?(' across '+esc(fwSet.join(', '))):'')+'. You\'ll see each control\'s readiness once it\'s connected.</p>'):'')+
       '</div>';
    // Step 3 — connect. One-click OAuth is the primary path; the manual credential
    // form is collapsed by default so the page stays simple. maybeRenderOauth()
    // reveals the button for OAuth-capable connectors and, when no OAuth provider is
    // configured, auto-opens the manual form (the only path) and hides the toggle.
    h+='<div class="sec"><h3>Connect</h3><div id="oauthBox"></div>';
    h+='<button class="back" id="manualToggle" style="display:block;margin-top:4px">Enter credentials manually instead</button>';
    h+='<div id="manualWrap" style="display:none;margin-top:8px">';
    h+='<p class="why" id="manualWhy">Read-only. Your secret is encrypted and never shown again.</p><div class="cols">';
    (m.required_auth_fields||[]).forEach(function(f){h+=fieldInput('auth',f);});
    (m.required_tenant_fields||[]).forEach(function(f){if(!(m.required_auth_fields||[]).some(function(a){return a.key===f.key;}))h+=fieldInput('tenant',f);});
    h+='</div>';
    // Plain-English access statement for the buyer; exact provider scope tokens are
    // tucked behind a collapsible expander for the admin who actually grants them.
    h+='<p class="why" style="margin-top:2px"><b>Read-only access only.</b> Nerion reads configuration and logs to assess controls — it can never change, create, or delete anything in your tool.</p>';
    if((m.required_permissions||[]).length){
      h+='<button class="back" id="scopeToggle" style="display:block;margin-top:4px">Show the exact technical scopes ('+(m.required_permissions||[]).length+')</button>';
      h+='<div id="scopeWrap" style="display:none;margin-top:6px"><div class="chips">'+(m.required_permissions||[]).map(function(p){return '<span class="perm">'+esc(p)+'</span>';}).join('')+'</div></div>';
    }
    // Scope / denominator / review — advanced, collapsed so connecting stays simple.
    var hasAdv=(m.required_scope_fields||[]).length||(m.required_denominator_fields||[]).length;
    h+='<button class="back" id="advToggle" style="display:block;margin-top:12px;margin-bottom:4px">Advanced: scope, denominator &amp; review period</button>';
    h+='<div id="advWrap" style="display:none;margin-top:8px">';
    if((m.required_scope_fields||[]).length){h+='<div class="sec" style="margin-top:8px"><h3>Confirm scope</h3><p class="why">Only what the controls this tool supports actually need.</p><div class="cols">';
      (m.required_scope_fields||[]).forEach(function(f){h+=fieldInput('scope',f);});h+='</div></div>';}
    if((m.required_denominator_fields||[]).length){h+='<div class="sec"><h3>Choose your denominator</h3><p class="why">Every coverage % needs an authoritative population, or related controls stay Not Ready.</p><div class="cols">';
      (m.required_denominator_fields||[]).forEach(function(f){h+=fieldInput('denom',f);});h+='</div></div>';}
    h+='<div class="sec"><h3>Review period</h3><div class="fld" style="max-width:220px"><select id="review__p" data-p="review" data-k="review"><option value="30d">Last 30 days</option><option value="90d" selected>Last 90 days</option><option value="12m">Last 12 months</option></select></div></div>';
    h+='</div>'; // /advWrap
    h+='<button class="btn" id="validate">Validate &amp; check readiness →</button>';
    h+='</div>'; // /manualWrap
    h+='<div id="readiness"></div>';
    h+='</div>';
    view.innerHTML=h;
    document.getElementById('back').onclick=renderCatalog;
    view.querySelectorAll('input,select').forEach(function(el){el.oninput=function(){var p=el.getAttribute('data-p'),k=el.getAttribute('data-k');if(p==='review'){FORM.review=el.value;return;}var v=el.value;if(el.getAttribute('type')!=='password'){/* keep */}FORM[p][k]=v;};});
    document.getElementById('validate').onclick=runValidate;
    // Toggles for the collapsed manual form and the advanced sub-section.
    var mt=document.getElementById('manualToggle');
    mt.onclick=function(){var w=document.getElementById('manualWrap');var open=w.style.display!=='none';w.style.display=open?'none':'block';mt.textContent=open?'Enter credentials manually instead':'Hide manual credentials';};
    var at=document.getElementById('advToggle');
    if(!hasAdv){at.style.display='none';}
    at.onclick=function(){var w=document.getElementById('advWrap');var open=w.style.display!=='none';w.style.display=open?'none':'block';at.textContent=(open?'Advanced: scope, denominator & review period':'Hide advanced options');};
    var st=document.getElementById('scopeToggle');
    if(st){var scn=(m.required_permissions||[]).length;st.onclick=function(){var w=document.getElementById('scopeWrap');var open=w.style.display!=='none';w.style.display=open?'none':'block';st.textContent=(open?'Show the exact technical scopes ('+scn+')':'Hide technical scopes');};}
    maybeRenderOauth(m.connector_id);
  }

  // Reveal the manual credential form and flip the toggle label. Used when the
  // connector has no one-click OAuth provider, so credentials are the only path.
  function openManual(){
    var w=document.getElementById('manualWrap'),mt=document.getElementById('manualToggle');
    if(w)w.style.display='block';
    if(mt)mt.style.display='none';
  }

  // Which connectors have an OAuth "one-click connect" provider.
  var OAUTH_MAP={entra:'microsoft',okta:'okta',google_workspace:'google',google:'google',gws:'google',github:'github'};
  function maybeRenderOauth(connectorId){
    var provider=OAUTH_MAP[connectorId];var box=document.getElementById('oauthBox');
    if(!provider||!box){openManual();return;} // no one-click for this tool → credentials are the only path
    api('/api/oauth/'+provider+'/status').then(function(s){
      if(!s||!s.configured){openManual();return;} // not wired on this instance → manual form only
      var dom=s.needsDomain?'<input id="oauthDomain" placeholder="your-org.okta.com" style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);font-size:13.5px;margin-bottom:8px">':'';
      box.innerHTML='<div style="margin-bottom:4px">'+dom+
        '<button class="btn" id="oauthBtn" style="width:100%;background:#2f6fe0">🔒 Connect with '+esc(s.label)+' — one click, read-only</button>'+
        '<p class="why" style="margin-top:8px;text-align:center">Grant read-only consent — no keys to paste. This is all you need to connect.</p></div>';
      document.getElementById('oauthBtn').onclick=function(){startOauth(provider,connectorId,s);};
    }).catch(function(){openManual();});
  }
  function startOauth(provider,connectorId,status){
    var q='?connector='+encodeURIComponent(connectorId);
    if(status&&status.needsDomain){var d=(document.getElementById('oauthDomain')||{}).value||'';if(!d){alert('Enter your '+status.label+' org domain first.');return;}q+='&domain='+encodeURIComponent(d.trim());}
    var btn=document.getElementById('oauthBtn');if(btn){btn.disabled=true;btn.textContent='Opening consent…';}
    api('/api/oauth/'+provider+'/start'+q).then(function(r){
      if(!r||!r.authorize_url){throw new Error((r&&r.message)||'could not start');}
      var w=window.open(r.authorize_url,'nerion_oauth','width=540,height=720');
      function onMsg(ev){var d=ev&&ev.data;if(!d||!d.nerion_oauth)return;window.removeEventListener('message',onMsg);
        if(d.nerion_oauth==='ok'){var rd=document.getElementById('readiness');if(rd)rd.innerHTML='<p class="muted" style="margin-top:14px">✅ Connected. Checking what Nerion can pull…</p>';
          api('/api/connectors/'+connectorId+'/test-collection',{method:'POST',body:JSON.stringify({})}).catch(function(){return null;})
            .then(function(){return api('/api/connectors/'+connectorId+'/readiness');}).then(renderReadiness).catch(function(){});
        } else { if(btn){btn.disabled=false;btn.textContent='🔒 Connect with '+(status?status.label:provider);} alert('Connection failed: '+(d.message||'unknown error')); }
      }
      window.addEventListener('message',onMsg);
      // Safety: re-enable the button if the popup is closed without completing.
      var iv=setInterval(function(){if(w&&w.closed){clearInterval(iv);if(btn&&btn.disabled){btn.disabled=false;btn.textContent='🔒 Connect with '+(status?status.label:provider);}}},800);
    }).catch(function(e){if(btn){btn.disabled=false;btn.textContent='🔒 Connect with '+(status?status.label:provider);}alert((e&&e.message)||'Could not start one-click connect — use the form below.');});
  }

  function nonEmpty(o){var r={};Object.keys(o||{}).forEach(function(k){if(o[k]!=='' && o[k]!=null)r[k]=o[k];});return r;}
  function runValidate(){
    var id=CURRENT.connector_id, btn=document.getElementById('validate');
    btn.disabled=true;btn.textContent='Validating…';
    var creds=Object.assign({},nonEmpty(FORM.auth),nonEmpty(FORM.tenant));
    var cfg={scope_configured:nonEmpty(FORM.scope),denominator_configured:nonEmpty(FORM.denom),review_period:FORM.review};
    // Three separate checks — connection, telemetry, then control readiness. Auth
    // success alone never makes a control ready.
    api('/api/connectors/'+id+'/validate',{method:'POST',body:JSON.stringify({credentials:creds})}).catch(function(){return null;})
      .then(function(){return api('/api/connectors/'+id+'/configure',{method:'POST',body:JSON.stringify(cfg)}).catch(function(){return null;});})
      .then(function(){return api('/api/connectors/'+id+'/validate-all',{method:'POST',body:JSON.stringify({})}).catch(function(){return null;});})
      .then(function(v){return (v&&v.status)?v.status:api('/api/connectors/'+id+'/status');})
      .then(renderReadiness)
      .catch(function(){document.getElementById('readiness').innerHTML='<p class="muted" style="margin-top:14px">Validation ran, but readiness could not be loaded (API/DB unavailable in this environment).</p>';})
      .then(function(){btn.disabled=false;btn.textContent='Re-validate';});
  }

  function pillCls(s){return s==='Ready'?'ready':s==='Partially Ready'?'partial':'not';}
  // Colour a badge/pill by whether a status is good / partial / not-ready / error.
  function badgeTone(s){s=String(s||'');
    if(/^(Connected|Telemetry Available|Ready for Operating Effectiveness Assessment|Ready)$/.test(s))return 'ready';
    if(/Partially|Partial|Design Assessment Only|Not Enough Evidence/.test(s))return 'partial';
    if(/Error|Invalid|Expired|Unreachable/.test(s))return 'not';
    return 'not';
  }
  function badge(label,val){return '<span class="tbadge '+badgeTone(val)+'"><i></i>'+esc(label)+': <b>'+esc(val)+'</b></span>';}
  function list(arr,cls){arr=arr||[];return arr.length?('<div class="rm '+(cls||'muted')+'">'+arr.map(esc).join(' · ')+'</div>'):'';}
  function renderReadiness(r){
    if(!r){document.getElementById('readiness').innerHTML='';return;}
    // Three DISTINCT badges — never one generic "Connected".
    var h='<div class="sec"><h3>Connector status</h3><div class="tbadges">'+
      badge('Connected', r.connection_status)+
      badge('Telemetry available', r.telemetry_status)+
      badge('Ready for continuous assessment', r.control_assessment_status)+
      '</div>';
    // Section 1 — Connection
    h+='<div class="rsec"><div class="rsec-h">1 · Connection</div>'+
      '<div class="rm">Status: <b>'+esc(r.connection_status)+'</b>'+(r.last_connection_check_at?(' · last checked '+esc(String(r.last_connection_check_at).slice(0,19).replace("T"," "))):'')+'</div>'+
      (badgeTone(r.connection_status)==='not'?'<div class="rm"><button class="btn" id="reconnectBtn" style="margin-top:6px;padding:7px 14px">Reconnect</button></div>':'')+'</div>';
    // Section 2 — Telemetry
    h+='<div class="rsec"><div class="rsec-h">2 · Telemetry</div>'+
      '<div class="rm">Status: <b>'+esc(r.telemetry_status)+'</b></div>'+
      (r.missing_permissions&&r.missing_permissions.length?('<div class="rm">Missing permissions: '+r.missing_permissions.map(esc).join(', ')+'</div>'):'')+
      (r.missing_telemetry&&r.missing_telemetry.length?('<div class="rm">Missing signals: '+r.missing_telemetry.slice(0,8).map(esc).join(', ')+'</div>'):'<div class="rm muted">All required signals available.</div>')+
      (r.last_telemetry_check_at?('<div class="rm muted">Last collection: '+esc(String(r.last_telemetry_check_at).slice(0,19).replace("T"," "))+'</div>'):'')+'</div>';
    // Section 3 — Control readiness
    h+='<div class="rsec"><div class="rsec-h">3 · Control readiness</div>'+
      '<div class="status"><span><b>'+(r.ready_controls||[]).length+'</b> ready for continuous assessment</span><span><b>'+(r.partially_ready_controls||[]).length+'</b> partially ready</span><span><b>'+(r.not_ready_controls||[]).length+'</b> not ready</span></div>'+
      (r.missing_denominators&&r.missing_denominators.length?('<div class="rm">Missing denominator: '+r.missing_denominators.map(esc).join(', ')+'</div>'):'')+
      (r.missing_scope&&r.missing_scope.length?'<div class="rm">Missing scope.</div>':'')+
      (r.missing_review_period&&r.missing_review_period.length?'<div class="rm">Missing review period.</div>':'')+
      (r.next_steps&&r.next_steps.length?('<div class="rm"><b>Next steps:</b> '+r.next_steps.map(esc).join(' ')+'</div>'):'');
    (r.control_readiness||[]).forEach(function(c){
      h+='<div class="rrow"><span class="pill '+pillCls(c.readiness_status)+'">'+esc(c.readiness_status)+'</span>'+
        '<div><div class="rn">'+esc(c.control_name)+' <span class="rid">'+esc(c.framework.split(' ')[0])+' '+esc(c.control_id)+'</span></div>'+
        '<div class="rm">'+esc(c.message)+'</div>'+
        (c.missing_evidence&&c.missing_evidence.length?('<div class="rm muted">Missing: '+c.missing_evidence.slice(0,6).map(esc).join(', ')+'</div>'):'')+'</div></div>';
    });
    h+='</div><p class="why" style="margin-top:12px">Connecting is not the same as being ready. Nerion proves it can connect, collect the required telemetry, and has enough scoped, fresh evidence before a control is “Ready for continuous assessment” — and never marks a control “Effective” during onboarding.</p></div>';
    document.getElementById('readiness').innerHTML=h;
    var rc=document.getElementById('reconnectBtn');if(rc)rc.onclick=function(){renderSetup();};
  }

  loadCatalog();
})();
</script>
</body>
</html>
