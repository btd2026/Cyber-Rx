services:
  # Web Service
  - type: web
    name: cyberrx-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://your-vercel-app.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: cyberrx-db
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: cyberrx-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: cyberrx-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: cyberrx-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: cyberrx-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: cyberrx-db
          property: password

databases:
  - name: cyberrx-db
    databaseName: cyberrx
    user: cyberrx_user
    plan: free
    region: oregon
