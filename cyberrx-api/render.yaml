services:
  # Web Service
  - type: web
    name: cyberrx-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://cyber-rx-frontend.vercel.app
      - key: CORS_ALLOWLIST
        value: https://cyber-rx-frontend.vercel.app,https://frontend-mu-drab-93.vercel.app,http://localhost:5173,http://localhost:3000,http://localhost:3001
      - key: DATABASE_URL
        fromDatabase:
          name: cyberrx-db
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: cyberrx-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: cyberrx-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: cyberrx-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: cyberrx-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: cyberrx-db
          property: password

  # Background Worker - Metrics Scheduler
  - type: worker
    name: cyberrx-scheduler
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm run scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE
        value: https://cyberrx-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: cyberrx-db
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: cyberrx-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: cyberrx-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: cyberrx-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: cyberrx-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: cyberrx-db
          property: password

databases:
  - name: cyberrx-db
    databaseName: cyberrx
    user: cyberrx_user
    plan: free
    region: oregon
