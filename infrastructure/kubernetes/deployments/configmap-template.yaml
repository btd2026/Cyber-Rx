# ConfigMap Template
# Variables: ${SERVICE_NAME}, ${NAMESPACE}, ${CONFIG_DATA}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${SERVICE_NAME}-config
  namespace: ${NAMESPACE}
  labels:
    app: ${SERVICE_NAME}
    platform: cyberrx
data:
  # Database Configuration
  DATABASE_HOST: "${DATABASE_HOST}"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "${DATABASE_NAME}"
  DATABASE_SSL_MODE: "require"
  DATABASE_POOL_MIN: "2"
  DATABASE_POOL_MAX: "20"

  # Event Hubs/Kafka Configuration
  EVENTHUBS_NAMESPACE: "${EVENTHUBS_NAMESPACE}"
  EVENTHUBS_NAME_SECURITY_EVENTS: "${EVENTHUBS_NAME_SECURITY_EVENTS}"
  EVENTHUBS_NAME_OPERATIONAL_EVENTS: "${EVENTHUBS_NAME_OPERATIONAL_EVENTS}"
  EVENTHUBS_CONSUMER_GROUP: "${EVENTHUBS_CONSUMER_GROUP}"
  KAFKA_BROKERS: "${KAFKA_BROKERS:-}"
  KAFKA_TOPIC_SECURITY: "${KAFKA_TOPIC_SECURITY:-}"
  KAFKA_TOPIC_OPERATIONAL: "${KAFKA_TOPIC_OPERATIONAL:-}"

  # Key Vault Configuration
  KEY_VAULT_URI: "${KEY_VAULT_URI}"
  KEY_VAULT_TENANT_ID: "${KEY_VAULT_TENANT_ID}"
  KEY_VAULT_CLIENT_ID: "${KEY_VAULT_CLIENT_ID}"

  # Service Configuration
  SERVICE_NAME: "${SERVICE_NAME}"
  SERVICE_PORT: "${SERVICE_PORT}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  ENVIRONMENT: "${ENVIRONMENT:-production}"

  # Tenant Configuration
  CUSTOMER_ID: "${CUSTOMER_ID}"
  TENANT_ID: "${TENANT_ID}"
  TENANT_TIER: "${TENANT_TIER}"

  # API Endpoints
  API_BASE_URL: "${API_BASE_URL}"
  API_TIMEOUT: "${API_TIMEOUT:-30000}"

  # Feature Flags
  FEATURE_THREAT_INTEL: "${FEATURE_THREAT_INTEL:-true}"
  FEATURE_CORRELATION: "${FEATURE_CORRELATION:-true}"
  FEATURE_REPORTING: "${FEATURE_REPORTING:-true}"

  # Performance Tuning
  CONCURRENT_WORKERS: "${CONCURRENT_WORKERS:-10}"
  BATCH_SIZE: "${BATCH_SIZE:-100}"
  CACHE_TTL: "${CACHE_TTL:-3600}"

  # Observability
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "${TRACING_ENABLED:-true}"
  LOG_FORMAT: "${LOG_FORMAT:-json}"

  # Security
  TLS_VERIFY: "true"
  TLS_MIN_VERSION: "1.2"
  ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
  CORS_ENABLED: "${CORS_ENABLED:-true}"

  # External APIs
  CISA_KEV_API_URL: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  NIST_NVD_API_URL: "https://services.nvd.nist.gov/rest/json/cves/2.0"
  EPSS_API_URL: "https://api.first.org/data/v1/epss"

  # Healthcare-Specific
  NASCO_API_URL: "${NASCO_API_URL:-}"
  NASCO_API_KEY: "${NASCO_API_KEY:-}"
  BCBS_VENDOR_ID: "${BCBS_VENDOR_ID:-}"

  # LLM Configuration
  LLM_PROVIDER: "${LLM_PROVIDER:-}"
  LLM_API_KEY: "${LLM_API_KEY:-}"
  LLM_MODEL: "${LLM_MODEL:-}"
  LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-4096}"
  LLM_TEMPERATURE: "${LLM_TEMPERATURE:-0.7}"

  # Data Retention
  RETENTION_DAYS_SECURITY_EVENTS: "${RETENTION_DAYS_SECURITY_EVENTS:-365}"
  RETENTION_DAYS_METRICS: "${RETENTION_DAYS_METRICS:-90}"
  RETENTION_DAYS_LOGS: "${RETENTION_DAYS_LOGS:-30}"

  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_RPM: "${RATE_LIMIT_RPM:-1000}"
  RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-100}"

  # Health Check Configuration
  HEALTH_CHECK_INTERVAL: "${HEALTH_CHECK_INTERVAL:-30}"
  HEALTH_CHECK_TIMEOUT: "${HEALTH_CHECK_TIMEOUT:-5}"
  HEALTH_CHECK_FAILURE_THRESHOLD: "${HEALTH_CHECK_FAILURE_THRESHOLD:-3}"
