# Secret Template
# Variables: ${SERVICE_NAME}, ${NAMESPACE}
# NOTE: This template creates placeholder secrets.
# Actual secret values should be injected from Key Vault using Secret Provider CSI or External Secrets Operator

---
apiVersion: v1
kind: Secret
metadata:
  name: ${SERVICE_NAME}-secrets
  namespace: ${NAMESPACE}
  labels:
    app: ${SERVICE_NAME}
    platform: cyberrx
  annotations:
    # This annotation tells the Secret Provider CSI to sync secrets from Key Vault
    secret-provider-class: "key-vault-secret-provider"
type: Opaque
data:
  # Database credentials (will be populated by Secret Provider CSI)
  DATABASE_PASSWORD: ""
  DATABASE_USERNAME: ""

  # Event Hubs connection string (will be populated by Secret Provider CSI)
  EVENTHUBS_CONNECTION_STRING: ""

  # API keys (will be populated by Secret Provider CSI)
  NASCO_API_KEY: ""
  LLM_API_KEY: ""

  # Service-specific secrets (will be populated by Secret Provider CSI)
  SERVICE_API_KEY: ""
  SERVICE_SECRET_KEY: ""
---
# SecretProviderClass for Azure Key Vault CSI Driver
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: key-vault-secret-provider
  namespace: ${NAMESPACE}
spec:
  provider: azure
  parameters:
    keyvaultName: "${KEY_VAULT_NAME}"
    objects: |
      array:
        - |
          objectName: database-password
          objectType: secret
        - |
          objectName: database-username
          objectType: secret
        - |
          objectName: eventhubs-connection-string
          objectType: secret
        - |
          objectName: nasco-api-key
          objectType: secret
        - |
          objectName: llm-api-key
          objectType: secret
        - |
          objectName: ${SERVICE_NAME}-api-key
          objectType: secret
        - |
          objectName: ${SERVICE_NAME}-secret-key
          objectType: secret
    tenantId: "${KEY_VAULT_TENANT_ID}"
  secretObjects:
  - secretName: ${SERVICE_NAME}-secrets
    type: Opaque
    data:
    - objectName: database-password
      key: DATABASE_PASSWORD
    - objectName: database-username
      key: DATABASE_USERNAME
    - objectName: eventhubs-connection-string
      key: EVENTHUBS_CONNECTION_STRING
    - objectName: nasco-api-key
      key: NASCO_API_KEY
    - objectName: llm-api-key
      key: LLM_API_KEY
    - objectName: ${SERVICE_NAME}-api-key
      key: SERVICE_API_KEY
    - objectName: ${SERVICE_NAME}-secret-key
      key: SERVICE_SECRET_KEY
