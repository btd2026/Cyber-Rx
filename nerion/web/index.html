<style>
:root{
  --ground:#F4F6F8;
  --surface:#FFFFFF;
  --surface-sunk:#EDF0F4;
  --border:#DCE2E9;
  --border-strong:#C3CCD7;
  --ink:#101720;
  --ink-2:#4E5A68;
  --ink-3:#8993A1;
  --accent:#0E6B75;
  --accent-soft:#E0EFF1;
  --good:#1D7A4C;
  --warn:#B0761A;
  --serious:#C0521C;
  --critical:#A32029;
  --unknown:#9AA4B1;
  --good-soft:#E3F2EA;
  --warn-soft:#FAF0DE;
  --serious-soft:#FBEAE1;
  --critical-soft:#F9E4E5;
  --shadow:0 1px 2px rgba(16,23,32,.06), 0 4px 14px rgba(16,23,32,.05);
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1219;
    --surface:#141C25;
    --surface-sunk:#0F161E;
    --border:#25313D;
    --border-strong:#384756;
    --ink:#E8EDF3;
    --ink-2:#A3AFBD;
    --ink-3:#6F7D8C;
    --accent:#4FBCC7;
    --accent-soft:#12333A;
    --good:#4CBB83;
    --warn:#D9A344;
    --serious:#E58150;
    --critical:#E06A73;
    --unknown:#65717F;
    --good-soft:#123326;
    --warn-soft:#33280F;
    --serious-soft:#37200F;
    --critical-soft:#361318;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1219;
  --surface:#141C25;
  --surface-sunk:#0F161E;
  --border:#25313D;
  --border-strong:#384756;
  --ink:#E8EDF3;
  --ink-2:#A3AFBD;
  --ink-3:#6F7D8C;
  --accent:#4FBCC7;
  --accent-soft:#12333A;
  --good:#4CBB83;
  --warn:#D9A344;
  --serious:#E58150;
  --critical:#E06A73;
  --unknown:#65717F;
  --good-soft:#123326;
  --warn-soft:#33280F;
  --serious-soft:#37200F;
  --critical-soft:#361318;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 72px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--surface);
  border-bottom:1px solid var(--border);
}
.topbar-in{
  max-width:1280px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand .dot{
  width:11px;height:11px;border-radius:2px;background:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.scope{
  display:flex;flex-direction:column;gap:1px;padding-left:20px;
  border-left:1px solid var(--border);
}
.scope b{font-size:13px;font-weight:600}
.scope span{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.spacer{flex:1}
.modes{display:flex;background:var(--surface-sunk);border-radius:7px;padding:3px;gap:2px}
.modes button{
  font:500 12.5px/1 var(--sans);color:var(--ink-2);background:none;border:0;
  padding:7px 13px;border-radius:5px;cursor:pointer;
}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.modes button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- as-of ---------- */
.asof{
  display:flex;align-items:center;gap:12px;padding:10px 20px;
  background:var(--surface-sunk);border-bottom:1px solid var(--border);
}
.asof-in{max-width:1280px;margin:0 auto;width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.asof label{font:600 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.asof input[type=range]{flex:1;min-width:200px;accent-color:var(--accent);height:20px}
.asof-date{font:600 13px/1 var(--mono);color:var(--ink);min-width:96px}
.asof-note{font-size:11.5px;color:var(--ink-3)}
.live-chip{
  font:600 10px/1 var(--mono);letter-spacing:.06em;padding:4px 7px;border-radius:4px;
  background:var(--good-soft);color:var(--good);
}
.live-chip.past{background:var(--warn-soft);color:var(--warn)}

/* ---------- framework tabs ---------- */
.fw{display:flex;align-items:flex-end;gap:2px;margin:26px 0 0;flex-wrap:wrap}
.fw button{
  font:600 13px/1 var(--sans);background:none;border:1px solid transparent;border-bottom:0;
  color:var(--ink-3);padding:11px 16px;cursor:pointer;border-radius:7px 7px 0 0;
}
.fw button[aria-pressed="true"]{
  background:var(--surface);border-color:var(--border);color:var(--ink);
}
.fw button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fw-note{margin-left:auto;font-size:11.5px;color:var(--ink-3);padding-bottom:12px}
.fw-note b{color:var(--accent);font-weight:600}

/* ---------- stat strip ---------- */
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:0 8px 8px 8px;
  overflow:hidden;
}
.stat{background:var(--surface);padding:16px 18px 14px}
.stat .k{font:600 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{
  font:600 27px/1.1 var(--mono);margin-top:9px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:7px;
}
.stat .v small{font:500 12px/1 var(--mono);color:var(--ink-3)}
.stat .d{font-size:11.5px;color:var(--ink-2);margin-top:7px;display:flex;align-items:center;gap:5px}
.trend-dn{color:var(--serious);font-weight:600}
.trend-up{color:var(--good);font-weight:600}

/* ---------- table ---------- */
.tablewrap{
  margin-top:22px;background:var(--surface);border:1px solid var(--border);
  border-radius:9px;overflow:hidden;box-shadow:var(--shadow);
}
.scroller{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:940px}
thead th{
  font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:12px 14px;background:var(--surface-sunk);
  border-bottom:1px solid var(--border);white-space:nowrap;
}
thead th.num{text-align:right}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr.grp td{
  background:var(--surface-sunk);padding:8px 14px;
  font:600 10.5px/1 var(--mono);letter-spacing:.13em;color:var(--ink-2);
}
tbody tr.ctl{cursor:pointer}
tbody tr.ctl:hover{background:var(--surface-sunk)}
tbody tr.ctl:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tbody tr.ctl.open{background:var(--accent-soft)}
.cid{font:600 12px/1 var(--mono);color:var(--ink);white-space:nowrap}
.cname{font-size:13px;color:var(--ink-2);margin-top:3px;max-width:330px}
.canon{font:500 10.5px/1 var(--mono);color:var(--ink-3);margin-top:4px}

/* effectiveness bar */
.ebar{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.ebar .track{width:74px;height:6px;border-radius:3px;background:var(--surface-sunk);overflow:hidden}
.ebar .fill{height:100%;border-radius:3px}
.ebar .n{font:600 13px/1 var(--mono);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.pct{font:600 13px/1 var(--mono);font-variant-numeric:tabular-nums}

/* confidence */
.conf{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pips{display:flex;gap:2px}
.pip{width:5px;height:13px;border-radius:1.5px;background:var(--surface-sunk)}
.pip.on{background:var(--accent)}
.conf .n{font:500 12px/1 var(--mono);color:var(--ink-2);min-width:30px;text-align:right}

/* insufficient evidence */
.insuf{
  display:inline-flex;align-items:center;gap:7px;justify-content:flex-end;width:100%;
}
.hatch{
  width:74px;height:16px;border-radius:3px;border:1px dashed var(--border-strong);
  background-image:repeating-linear-gradient(135deg,var(--unknown) 0 1px,transparent 1px 5px);
  opacity:.6;
}
.insuf span{font:500 10.5px/1 var(--sans);color:var(--ink-3);white-space:nowrap}

.spark{display:block}

/* ---------- detail panel ---------- */
tr.detail td{padding:0;background:var(--surface-sunk);border-bottom:1px solid var(--border)}
.panel{padding:22px 20px 26px;display:grid;gap:20px}
.claim{
  font-size:16px;line-height:1.45;font-weight:500;max-width:70ch;letter-spacing:-.01em;
  padding-left:13px;border-left:3px solid var(--accent);
}
.claim em{font-style:normal;color:var(--accent);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:15px 16px 16px}
.card h4{
  margin:0 0 12px;font:600 10.5px/1 var(--sans);letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);
}
.kv{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:13px}
.kv+.kv{border-top:1px solid var(--border)}
.kv .k{color:var(--ink-2)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.flag{color:var(--serious);font-weight:600}

/* uptime timeline */
.tl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:12px;flex-wrap:wrap}
.tl-head .big{font:600 21px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tl-head .sub{font-size:12px;color:var(--ink-2)}
.timeline{display:flex;gap:1px;height:34px;align-items:stretch}
.seg{flex:1;border-radius:1px;position:relative;cursor:default}
.seg.up{background:var(--good);opacity:.82}
.seg.deg{background:var(--warn)}
.seg.down{background:var(--critical)}
.seg.blind{
  background-image:repeating-linear-gradient(135deg,var(--unknown) 0 1px,transparent 1px 4px);
  border-top:1px dashed var(--border-strong);border-bottom:1px dashed var(--border-strong);
}
.seg:hover{outline:2px solid var(--ink);outline-offset:1px;z-index:2;border-radius:2px}
.tl-axis{display:flex;justify-content:space-between;margin-top:7px;font:500 10.5px/1 var(--mono);color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* defense chain */
.chain{display:grid;gap:9px}
.link{display:grid;grid-template-columns:64px 1fr 40px;gap:10px;align-items:center}
.link .lbl{font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.link .track{height:8px;border-radius:4px;background:var(--surface-sunk);overflow:hidden}
.link .fill{height:100%;border-radius:4px;background:var(--accent)}
.link .n{font:600 12.5px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.scen{
  font:600 11px/1 var(--mono);color:var(--ink-2);margin-bottom:11px;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.tag{
  font:600 10px/1 var(--mono);padding:3px 6px;border-radius:3px;
  background:var(--accent-soft);color:var(--accent);letter-spacing:.03em;
}

/* entity table */
.ent{width:100%;border-collapse:collapse;min-width:0}
.ent td{padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.ent tr:last-child td{border-bottom:0}
.ent .cnt{
  text-align:right;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;
  width:44px;
}
.ent .barcell{width:100px}
.ent .minibar{height:7px;border-radius:3px;background:var(--surface-sunk);overflow:hidden}
.ent .minibar i{display:block;height:100%;border-radius:3px}
.st{display:inline-flex;align-items:center;gap:6px}
.st i{width:8px;height:8px;border-radius:2px;flex:none}

/* fixes */
.fix{display:flex;gap:11px;padding:9px 0;font-size:13px;align-items:flex-start}
.fix+.fix{border-top:1px solid var(--border)}
.fix .rank{
  font:600 10.5px/1 var(--mono);color:var(--accent);background:var(--accent-soft);
  padding:4px 6px;border-radius:3px;flex:none;margin-top:1px;
}
.fix .gain{margin-left:auto;font:600 12px/1 var(--mono);color:var(--good);white-space:nowrap;flex:none}

/* board mode */
.board{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));margin-top:22px}
.bcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:18px 19px 19px;box-shadow:var(--shadow)}
.bcard .id{font:600 10.5px/1 var(--mono);color:var(--ink-3);letter-spacing:.08em}
.bcard h3{margin:8px 0 4px;font-size:16.5px;letter-spacing:-.015em;text-wrap:balance}
.bcard .where{font-size:12px;color:var(--ink-2);margin-bottom:15px}
.bcard .verdict{
  margin-top:15px;padding-top:13px;border-top:1px solid var(--border);
  font-size:13px;line-height:1.5;color:var(--ink-2);
}
.bcard .verdict b{color:var(--ink)}

.foot{margin-top:26px;font-size:11.5px;color:var(--ink-3);display:flex;gap:18px;flex-wrap:wrap}
.foot code{font-family:var(--mono);color:var(--ink-2)}

.tip{
  position:fixed;z-index:90;pointer-events:none;opacity:0;transition:opacity .09s;
  background:var(--ink);color:var(--ground);font:500 11.5px/1.45 var(--mono);
  padding:7px 9px;border-radius:5px;max-width:230px;
}
.tip.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- uptime timelines ---------- */
const DAYS=90;
C.forEach(c=>{
  const r=rng(c.seed*7919);
  const segs=[];let state="up";
  for(let i=0;i<DAYS;i++){
    const p=r();
    if(state==="up"){ if(p<.035) state="deg"; else if(p<.045) state="blind"; }
    else if(state==="deg"){ if(p<.30) state="up"; else if(p<.36) state="down"; }
    else if(state==="down"){ if(p<.26) state="deg"; }
    else if(state==="blind"){ if(p<.34) state="up"; }
    if(c.insufficient && r()<.30) state="blind";
    if(c.eff>.8 && r()<.35) state="up";
    segs.push(state);
  }
  c.segs=segs;
});

function upTo(c,day){
  const s=c.segs.slice(0,day+1);
  const up=s.filter(x=>x==="up").length, blind=s.filter(x=>x==="blind").length;
  return {uptime:up/s.length, blind:blind/s.length};
}
function effAt(c,day){
  const {uptime,blind}=upTo(c,day);
  const base=c.eff*(0.72+0.35*uptime);
  return Math.max(0,Math.min(1,base));
}
function confAt(c,day){
  const {blind}=upTo(c,day);
  return Math.max(0.05,Math.min(1,c.conf*(1-blind*0.55)));
}
function statusOf(v){return v>=.75?"good":v>=.55?"warn":v>=.35?"serious":"critical";}
function colorOf(v){return "var(--"+statusOf(v)+")";}

function dateFor(d){
  const t=new Date(2026,7,24); t.setDate(t.getDate()-(DAYS-1-d));
  return t.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}

/* ---------- tooltip ---------- */
function bindTip(el,text){
  el.addEventListener("mouseenter",e=>{tip.textContent=text;tip.classList.add("on");move(e);});
  el.addEventListener("mousemove",move);
  el.addEventListener("mouseleave",()=>tip.classList.remove("on"));
  function move(e){
    const x=Math.min(e.clientX+14,window.innerWidth-244);
    tip.style.left=x+"px"; tip.style.top=(e.clientY+16)+"px";
  }
}

/* ---------- renderers ---------- */
function spark(c,w=64,h=18){
  const pts=[];const step=Math.max(1,Math.floor((day+1)/22));
  for(let i=0;i<=day;i+=step){const v=effAt(c,i);pts.push(v);}
  if(pts.length<2)pts.push(pts[0]||0);
  const mx=Math.max(...pts,.001),mn=Math.min(...pts);
  const rg=Math.max(mx-mn,.06);
  const d=pts.map((v,i)=>{
    const x=(i/(pts.length-1))*w, y=h-2-((v-mn)/rg)*(h-5);
    return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
  }).join(" ");
  const last=pts[pts.length-1];
  const ly=h-2-((last-mn)/rg)*(h-5);
  const dir=pts[pts.length-1]-pts[0];
  const col=dir<-0.02?"var(--serious)":dir>0.02?"var(--good)":"var(--ink-3)";
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+w+'" cy="'+ly.toFixed(1)+'" r="2.5" fill="'+col+'"/></svg>';
}

function pips(v){
  const n=Math.round(v*5);
  let s='<span class="pips" aria-hidden="true">';
  for(let i=0;i<5;i++) s+='<span class="pip'+(i<n?" on":"")+'"></span>';
  return s+'</span>';
}

  else cols.push('<th class="num">90-day trend</th>');

  thead.innerHTML=cols.join("");
}

function rowFor(c){
  const e=effAt(c,day), u=upTo(c,day).uptime, cf=confAt(c,day);
  const insuf=cf<0.35;
  const tr=document.createElement("tr");
  tr.className="ctl"+(open===c.csf?" open":"");
  tr.tabIndex=0;
  tr.setAttribute("role","button");
  tr.setAttribute("aria-expanded",open===c.csf?"true":"false");

  let html='<td><div class="cid">'+c[fw]+'</div><div class="cname">'+c.name+'</div>'+
    (mode!=="assessor"?'<div class="canon">'+c.canon.join(" · ")+'</div>':'')+'</td>';

  if(mode==="assessor") html+='<td><div class="canon" style="color:var(--ink-2)">'+c.canon.join("<br>")+'</div></td>';

  html+='<td class="num">'+(insuf
    ? '<span class="insuf"><span class="hatch"></span><span>insufficient evidence</span></span>'
    : '<span class="ebar"><span class="track"><span class="fill" style="width:'+(e*100).toFixed(0)+'%;background:'+colorOf(e)+'"></span></span><span class="n">'+e.toFixed(2)+'</span></span>')+'</td>';

  html+='<td class="num"><span class="pct" style="color:'+colorOf(u)+'">'+(u*100).toFixed(1)+'%</span></td>';
  html+='<td class="num"><span class="conf">'+pips(cf)+'<span class="n">'+cf.toFixed(2)+'</span></span></td>';

  if(mode==="assessor"){
    const cls=cf>.6?"telemetry":cf>.35?"config export":"attestation";
    html+='<td class="num"><span style="font:500 11px/1 var(--mono);color:var(--ink-2)">'+cls+'</span></td>';
  } else {
    html+='<td class="num">'+spark(c)+'</td>';
  }

  const pctEnt=c.ent.ver/c.ent.claim;
  html+='<td class="num"><span class="pct" style="color:'+colorOf(pctEnt)+'">'+c.ent.ver+'<span style="color:var(--ink-3);font-weight:400">/'+c.ent.claim+'</span></span></td>';

  tr.innerHTML=html;
  const toggle=()=>{open=(open===c.csf?null:c.csf);render();};
  tr.addEventListener("click",toggle);
  tr.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();toggle();}});
  return tr;
}

function renderStats(){
  const measured=C.filter(c=>confAt(c,day)>=0.35);
  const avgE=measured.reduce((a,c)=>a+effAt(c,day),0)/measured.length;
  const avgU=C.reduce((a,c)=>a+upTo(c,day).uptime,0)/C.length;
  const avgC=C.reduce((a,c)=>a+confAt(c,day),0)/C.length;
  const weakest=C.reduce((m,c)=>effAt(c,day)<effAt(m,day)?c:m,C[0]);
  const prevE=(()=>{const d=Math.max(0,day-30);const m=C.filter(c=>confAt(c,d)>=0.35);return m.reduce((a,c)=>a+effAt(c,d),0)/m.length;})();
  const delta=avgE-prevE;

  $("#stats").innerHTML=
   '<div class="stat"><div class="k">Group effectiveness</div><div class="v" style="color:'+colorOf(avgE)+'">'+avgE.toFixed(2)+'<small>weighted</small></div>'+
     '<div class="d"><span class="'+(delta<0?"trend-dn":"trend-up")+'">'+(delta<0?"▼":"▲")+' '+Math.abs(delta).toFixed(2)+'</span> vs. 30 days ago</div></div>'+
   '<div class="stat"><div class="k">Weakest entity</div><div class="v" style="color:var(--critical)">'+effAt(weakest,day).toFixed(2)+'</div>'+
     '<div class="d">'+weakest[fw]+' — attackers don\'t experience your average</div></div>'+
   '<div class="stat"><div class="k">Control uptime</div><div class="v" style="color:'+colorOf(avgU)+'">'+(avgU*100).toFixed(1)+'<small>%</small></div>'+
     '<div class="d">across '+C.length+' measured controls</div></div>'+
   '<div class="stat"><div class="k">Assurance confidence</div><div class="v">'+avgC.toFixed(2)+'</div>'+
     '<div class="d">'+(C.length-measured.length)+' controls below evidence threshold</div></div>'+
   '<div class="stat"><div class="k">Ghosts</div><div class="v" style="color:var(--serious)">1,231</div>'+
     '<div class="d">workers with no identity Nerion can see</div></div>';
}

    }).join("");
    return '<div class="bcard"><div class="id">'+id+'</div><h3>'+s.name+'</h3>'+
      '<div class="where">'+s.where+'</div><div class="chain">'+chain+'</div>'+
      '<div class="verdict">Held down by <b>'+linked.length+'</b> measured controls, of which <b>'+degraded+'</b> are currently degraded. '+
      'Weakest link is <b>'+(s.chain.respond<s.chain.detect?"respond":"detect")+'</b>.</div></div>';
  }).join("");
}

function render(){
  $("#asofDate").textContent=dateFor(day);
  const chip=$("#liveChip");
  chip.textContent=day===DAYS-1?"LIVE":(DAYS-1-day)+" DAYS BACK";
  chip.className="live-chip"+(day===DAYS-1?"":" past");

  renderStats();

  if(mode==="board"){
    $("#tableWrap").hidden=true; $("#board").hidden=false; renderBoard(); return;
  }
  $("#tableWrap").hidden=false; $("#board").hidden=true;

  headerRow();
  tbody.innerHTML="";
  FNORDER.forEach(fn=>{
    const rows=C.filter(c=>c.fn===fn);
    if(!rows.length)return;
    const g=document.createElement("tr");g.className="grp";
    const gt=document.createElement("td");gt.colSpan=mode==="assessor"?7:6;gt.textContent=fn;
    g.appendChild(gt);tbody.appendChild(g);
    rows.forEach(c=>{
      tbody.appendChild(rowFor(c));
      if(open===c.csf) tbody.appendChild(detailFor(c));
    });
  });
}

/* ---------- events ---------- */
document.querySelectorAll(".fw button").forEach(b=>b.addEventListener("click",()=>{
  fw=b.dataset.fw;
  document.querySelectorAll(".fw button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
  render();
}));
document.querySelectorAll(".modes button").forEach(b=>b.addEventListener("click",()=>{
  mode=b.dataset.mode;
  document.querySelectorAll(".modes button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
  render();
}));
$("#asof").addEventListener("input",e=>{day=+e.target.value;render();});

open="PR.AA-03";
render();
})();
</script>
